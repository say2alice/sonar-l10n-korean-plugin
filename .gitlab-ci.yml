# 병합 요청과 develop, main, release/* 푸시에서 ./mvnw verify를 실행하고, 브랜치 푸시에서는 SonarQube Cloud로 분석합니다.
# v<버전> 태그에서는 GitLab 릴리스와 GitHub 릴리스를 만듭니다.
# 설계: 문서 저장소 docs/design/development-environment.md §6
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    # 이전 기준 버전의 재릴리스용 유지보수 브랜치(문서 저장소 ADR-0024)
    - if: $CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

variables:
  # 캐시는 프로젝트 폴더 안만 담으므로 Wrapper 배포본과 로컬 저장소를 이곳으로 옮깁니다
  MAVEN_USER_HOME: "$CI_PROJECT_DIR/.m2"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

.maven:
  image: eclipse-temurin:25-jdk
  tags:
    - shared-docker
  cache:
    key: maven
    paths:
      - .m2/repository
      - .m2/wrapper
  before_script:
    # mvnw는 unzip이 없으면 .tar.gz를 받아 .zip 기준으로 고정한 SHA-256 검증에 실패합니다. curl, jq는 릴리스 잡이 씁니다
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip curl jq > /dev/null
    # 컴파일과 테스트의 JDK는 Toolchains로 고르므로 이미지의 JDK 25를 등록합니다
    - mkdir -p "$HOME/.m2"
    - >-
      printf '<toolchains><toolchain><type>jdk</type><provides><version>25</version></provides><configuration><jdkHome>%s</jdkHome></configuration></toolchain></toolchains>\n'
      "$JAVA_HOME" > "$HOME/.m2/toolchains.xml"

verify:
  extends: .maven
  # 미번역 키는 릴리스(main 병합) 때만 실패로 처리합니다(문서 저장소 ADR-0014)
  # 빌드와 검사에 영향을 주는 경로가 바뀐 때만 실행합니다. README 같은 문서만 바뀐 푸시와 병합 요청에서는
  # 파이프라인이 생기지 않습니다. 빌드가 새 경로를 읽게 되면 아래 목록에 더합니다(문서 저장소 개발환경 설계 §6)
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
      changes: &build-inputs
        - pom.xml
        - mvnw
        - mvnw.cmd
        - .mvn/**/*
        - .gitattributes
        - .gitlab-ci.yml
        - src/**/*
        - translation/**/*
        - scripts/**/*
      variables:
        REQUIRE_COMPLETE: "true"
    - changes: *build-inputs
  variables:
    REQUIRE_COMPLETE: "false"
    # SonarQube Cloud 분석은 커밋 이력으로 새 코드를 가립니다
    GIT_DEPTH: "0"
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  cache:
    - key: maven
      paths:
        - .m2/repository
        - .m2/wrapper
    - key: sonar
      paths:
        - .sonar/cache
  # 브랜치 푸시에서는 빌드 뒤 SonarQube Cloud로 분석하고 품질 게이트가 통과해야 잡이 성공합니다.
  # 병합 요청은 분석하지 않습니다. 프로젝트가 GitHub 미러에 연결되어 있어 MR 번호가 PR 번호로 해석되기 때문입니다(문서 저장소 ADR-0023)
  script:
    - |
      if [ -n "${CI_COMMIT_BRANCH:-}" ] && [ -n "${SONAR_TOKEN:-}" ]; then
        ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dtranslation.requireComplete=$REQUIRE_COMPLETE \
          -Dsonar.branch.name="$CI_COMMIT_BRANCH" -Dsonar.qualitygate.wait=true
      else
        ./mvnw -B verify -Dtranslation.requireComplete=$REQUIRE_COMPLETE
      fi

# 태그와 pom.xml 버전 확인, 태그 커밋의 SonarQube Cloud 품질 게이트 확인, 미번역을 실패로 처리하는 빌드, jar 올리기,
# 릴리스 생성(문서 저장소 ADR-0018, ADR-0023)
release:
  extends: .maven
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - scripts/release.sh "$CI_COMMIT_TAG"

# GitLab 릴리스와 같은 릴리스를 GitHub 미러 저장소에 만듭니다(문서 저장소 ADR-0021).
# 잡을 나눠 두어 GitHub 단계만 실패했을 때 이 잡만 다시 실행합니다. GITHUB_TOKEN은 보호 태그 v*에만 전달되는 CI/CD 변수입니다
github-release:
  image: eclipse-temurin:25-jdk
  tags:
    - shared-docker
  needs:
    - release
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl jq > /dev/null
  script:
    - scripts/github-release.sh "$CI_COMMIT_TAG"
