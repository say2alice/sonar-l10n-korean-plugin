settings.mode.save.success=이제 이 인스턴스는 {isStandardMode, select, true {표준 환경} other {다중 품질 규칙 모드}}입니다.
mode.standard.advertisement=보안, 신뢰성, 유지보수성 이슈를 찾으시나요? 팀이 소프트웨어 품질 기준으로 작업하는 것을 선호하면 <a>설정</a>에서 변경하세요
mode.mqr.advertisement=버그, 취약점, Code Smell을 찾으시나요? 팀이 이 유형으로 작업하는 것을 선호하면 <a>설정</a>에서 변경하세요
settings.mode.mqr.advertisement=팀에서 취약점, 버그, Code Smell로 작업하는 편이 좋다면 일반 설정의 <a>모드 섹션</a>에서 바꾸세요
settings.mode.standard.advertisement=팀에서 보안, 신뢰성, 유지보수성 이슈로 작업하는 편이 좋다면 일반 설정의 <a>모드 섹션</a>에서 바꾸세요
settings.early_access.title=얼리 액세스 기능
settings.early_access.description=아래 기능은 Sonar의 재량으로 얼리 액세스 체험을 통해 무료로 제공됩니다. 체험은 언제든 중단될 수 있습니다. 체험 기간에 이 기능을 써도 조직에 비용이 청구되지 않습니다. 약관이 적용될 수 있습니다.
