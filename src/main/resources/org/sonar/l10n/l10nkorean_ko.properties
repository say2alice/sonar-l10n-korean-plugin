settings.early_access.misra.description.line2=체험이 끝나면 MISRA 준수 얼리 액세스 기능이 비활성화되고 새 MISRA C++2023 규칙은 모두 품질 프로필에서 제거됩니다. 조직에 비용이 청구되지 않습니다.
settings.early_access.misra.checkbox_label=MISRA 준수 얼리 액세스 활성화
