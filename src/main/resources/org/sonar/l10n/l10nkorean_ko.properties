quality_profiles.intro=품질 프로필은 분석할 때 적용할 규칙의 모음입니다. 언어마다 기본 프로필이 있으며, 다른 프로필에 명시적으로 할당하지 않은 프로젝트는 모두 기본 프로필로 분석합니다. 한 언어에는 모든 프로젝트가 같은 프로필을 쓰는 것이 가장 좋습니다. <p1>AI가 생성한 코드가 있는 프로젝트에는 엄격한 품질 프로필이 필요합니다. Sonar way 품질 프로필을 권장합니다.</p1> <p2><link>문서에서 품질 프로필</link> 자세히 알아보기</p2>
