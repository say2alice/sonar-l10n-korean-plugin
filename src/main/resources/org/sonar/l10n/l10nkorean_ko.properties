vortex_dashboard.adoption_coverage.project_coverage.toggletip.description=이 차트에서 프로젝트는 선택한 기간에 기본 브랜치나 장기 브랜치에서 분석이 한 번 이상 있었거나 Vortex를 사용했으면 활성 상태입니다. 풀 리퀘스트 분석만으로는 활동으로 세지 않습니다.
