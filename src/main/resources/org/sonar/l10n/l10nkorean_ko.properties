settings.early_access.misra.dialog_description.enable=이 인스턴스에서 추가 MISRA C++2023 규칙을 미리 볼 수 있습니다. <p>Sonar는 언제든 체험을 중단할 수 있습니다. 중단되면 MISRA 준수 얼리 액세스 기능이 비활성화되고, 새 MISRA C++2023 규칙은 모두 품질 프로필에서 제거되며, 관련해 감지된 이슈는 모두 닫힙니다.</p> 조직에 비용이 청구되지 않습니다.
settings.early_access.misra.dialog_description.disable=새 MISRA C++2023 규칙은 모두 품질 프로필에서 제거되고, 관련해 감지된 이슈는 모두 닫힙니다. 이 기능의 얼리 액세스가 제공되는 동안에는 다시 활성화할 수 있습니다. <p>계속하시겠습니까?</p>
settings.early_access.misra.success=이 인스턴스에서 MISRA 준수 얼리 액세스가 {enabled, select, true {활성화되었습니다} other {비활성화되었습니다}}
