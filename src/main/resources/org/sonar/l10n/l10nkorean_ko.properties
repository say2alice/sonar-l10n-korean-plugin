settings.mode.standard.name=표준 환경
settings.mode.mqr.name=다중 품질 규칙(MQR) 모드
settings.mode.standard.description.line1=규칙 유형(버그, Code Smell, 취약점)을 기존 방식대로 씁니다. 규칙마다 유형과 심각도가 하나씩 있습니다.
settings.mode.standard.description.line2=이 방식은 규칙과 그 이슈가 가장 크게 영향을 주는 소프트웨어 품질 하나(예: 보안, 신뢰성, 유지보수성)를 기준으로 심각도를 정합니다. {productName} 9.9 LTA 이전에 쓰던 규칙 분류입니다.
settings.mode.mqr.description.line1=소프트웨어가 모든 소프트웨어 품질에 주는 영향을 더 정확하게 나타내는 것이 목표입니다. 소프트웨어 품질 하나에만 영향을 주는 이슈는 거의 없습니다. 예를 들어 취약점은 대부분 버그이기도 하며, 그 반대도 마찬가지입니다. MQR 모드는 각 규칙을 그 규칙이 영향을 주는 품질마다 대응시키고, 품질마다 심각도를 따로 매깁니다.
settings.mode.mqr.description.line2=이 방식은 가장 심각한 영향만이 아니라 이슈가 모든 소프트웨어 품질에 주는 영향을 분명히 보여 주는 데 중점을 둡니다.
settings.mode.save.warning=인스턴스에 반영하려면 변경 사항을 저장하세요
