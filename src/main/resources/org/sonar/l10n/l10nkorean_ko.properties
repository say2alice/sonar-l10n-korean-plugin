component_measures.overview.project_overview.title=위험
component_measures.overview.project_overview.description=운영 위험을 한눈에 파악하세요. 키보드를 쓰는 사용자를 위해 요소는 파일별 코드 라인 수로 정렬됩니다. 녹색이 아닌 색은 바로 살펴봐야 할 위험, 곧 버그나 취약점을 나타냅니다. 그래프의 위쪽이나 오른쪽에 있으면 장기적인 상태가 위험할 수 있다는 뜻입니다. 왼쪽 아래의 녹색 거품이 가장 좋습니다.
component_measures.overview.Reliability.description=버그의 운영 위험을 확인하세요. 키보드를 쓰는 사용자를 위해 요소는 파일별 버그 양으로 정렬됩니다. 거품 색이 빨간색에 가까울수록 가장 나쁜 버그가 심각합니다. 거품 크기는 버그 양을, 세로 위치는 버그를 해결하는 데 드는 예상 시간을 나타냅니다. 아래쪽 가장자리의 작은 녹색 거품이 가장 좋습니다.
component_measures.overview.Security.description=취약점의 운영 위험을 확인하세요. 키보드를 쓰는 사용자를 위해 요소는 파일별 취약점 양으로 정렬됩니다. 거품 색이 빨간색에 가까울수록 가장 나쁜 취약점이 심각합니다. 거품 크기는 취약점 양을, 세로 위치는 취약점을 해결하는 데 드는 예상 시간을 나타냅니다. 아래쪽 가장자리의 작은 녹색 거품이 가장 좋습니다.
component_measures.overview.Maintainability.description=Code Smell의 장기 위험을 확인하세요. 키보드를 쓰는 사용자를 위해 요소는 파일별 Code Smell 양으로 정렬됩니다. 거품 색이 빨간색에 가까울수록 기술 부채 비율이 높습니다. 거품 크기는 Code Smell 양을, 세로 위치는 Code Smell을 해결하는 데 드는 예상 시간을 나타냅니다. 아래쪽 가장자리의 작은 녹색 거품이 가장 좋습니다.
component_measures.overview.Coverage.description=테스트 커버리지 부족의 장기 위험을 확인하세요. 키보드를 쓰는 사용자를 위해 요소는 파일별 커버되지 않은 라인 양으로 정렬됩니다. 거품 크기는 커버되지 않은 라인의 양을, 세로 위치는 부족한 커버리지의 양을 나타냅니다. 아래쪽 가장자리의 작은 거품이 가장 좋습니다.
component_measures.overview.Duplications.description=중복의 장기 위험을 확인하세요. 키보드를 쓰는 사용자를 위해 요소는 파일별 중복 블록 수로 정렬됩니다. 거품 크기는 중복 블록의 양을, 세로 위치는 그 블록에 든 라인의 양을 나타냅니다. 아래쪽 가장자리의 작은 거품이 가장 좋습니다.
component_measures.overview.see_data_as_list=이 차트의 데이터를 목록으로 보기
component_measures.domain_subnavigation.Reliability.help=이 영역의 이슈는 예상과 다르게 동작할 코드를 표시합니다.
component_measures.domain_subnavigation.Maintainability.help=이 영역의 이슈는 필요 이상으로 제대로 업데이트하기 어려운 코드를 표시합니다.
component_measures.domain_subnavigation.Security.help=이 영역의 이슈는 해커에게 약점이 될 수 있는 곳을 표시합니다.
component_measures.domain_subnavigation.SecurityReview.help=이 영역은 핫스팟과 그 검토 상태로 잠재적인 보안 위험을 나타냅니다.
component_measures.domain_subnavigation.Complexity.help=애플리케이션의 제어 흐름이 얼마나 단순하거나 복잡한지 나타냅니다. 순환 복잡도는 완전한 테스트 커버리지에 필요한 최소 테스트 케이스 수를 측정합니다. 인지 복잡도는 애플리케이션을 이해하기가 얼마나 어려운지를 측정합니다
