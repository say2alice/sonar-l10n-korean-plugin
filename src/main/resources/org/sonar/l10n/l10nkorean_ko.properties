vortex_dashboard.nav_item=Vortex
vortex_dashboard.description.paragraph1=Vortex saves engineering time and tokens by providing your agents with context (Guide) before code is written, and fixing issues (Verify) as it's being written.
vortex_dashboard.description.paragraph2=This dashboard breaks down each project's savings as Vortex is being used. Read our documentation to <link>learn more about Vortex</link>.
