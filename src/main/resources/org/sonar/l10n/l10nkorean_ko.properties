roles.page=프로젝트 권한
roles.page.description2=프로젝트 수준 권한을 부여하고 회수합니다. 권한은 그룹이나 개별 사용자에게 부여할 수 있습니다.
roles.page.description_portfolio=포트폴리오 수준 권한을 부여하고 회수합니다. 권한은 그룹이나 개별 사용자에게 부여할 수 있습니다.
roles.page.description_application=애플리케이션 수준 권한을 부여하고 회수합니다. 권한은 그룹이나 개별 사용자에게 부여할 수 있습니다.
roles.page.description.github=GitHub에서 프로비저닝된 사용자의 프로젝트 권한은 읽기 전용입니다. GitHub 사용자가 아니면 권한을 제거만 할 수 있습니다.
