vortex_dashboard.impact_roi.guide.tooltip_description=<p>방지한 이슈는 Sonar의 에이전트 중심 개발 주기(ACDC)에서 Vortex Guide가 낸 결과의 추정치입니다.</p><p>Vortex Guide는 에이전트가 코드를 작성하기 전과 작성하는 동안 AI 에이전트에 관련 컨텍스트, 안전장치, 표준, 제약 조건을 제공해 결과물이 조직의 요구사항을 충족하도록 돕습니다.</p><p>이 컨텍스트가 없으면 에이전트는 기능상 올바르지만 코딩 표준, 아키텍처, 보안 태세에 맞지 않는 코드를 만들 수 있습니다.</p>
vortex_dashboard.impact_roi.verify.heading=Vortex Verify
vortex_dashboard.impact_roi.verify.value_label=해결한 이슈
vortex_dashboard.impact_roi.verify.tooltip_title=해결한 이슈(Verify)
vortex_dashboard.impact_roi.verify.tooltip_description=<p>해결한 이슈는 Sonar의 에이전트 중심 개발 주기(ACDC)에서 Vortex Verify가 낸 결과를 측정한 값입니다.</p><p>에이전트가 코드를 작성하면 Vortex Verify가 SonarQube 규칙으로 변경 사항을 분석하고, 에이전트가 처리할 발견 사항을 돌려줍니다.</p><p>한 분석에서 발견된 이슈가 에이전트의 코드 수정과 Vortex의 재검증 뒤에 더 이상 나타나지 않으면 해결한 것으로 셉니다.</p><p>이렇게 하면 변경 사항이 풀 리퀘스트에 이르기 전에 이슈를 처리해 후속 재작업을 줄일 수 있습니다.</p>
vortex_dashboard.impact_roi.engineering_time.heading=절약한 엔지니어링 시간
vortex_dashboard.impact_roi.engineering_time.value_label=절약한 시간
vortex_dashboard.impact_roi.engineering_time.tooltip_title=예상 절약 시간
vortex_dashboard.impact_roi.engineering_time.tooltip_description=<p>Vortex가 이슈를 일찍 잡거나 막아 줄인 엔지니어링 시간의 추정치입니다.</p><p>Sonar의 수정 작업량과 검토, 재작업에 대한 보수적인 가정을 사용합니다.</p>
vortex_dashboard.impact_roi.tokens.heading=절약한 토큰
vortex_dashboard.impact_roi.tokens.value_label=절약한 토큰
vortex_dashboard.impact_roi.tokens.tooltip_title=예상 절약 토큰
vortex_dashboard.impact_roi.tokens.tooltip_description=에이전트가 코드베이스를 더 탐색하게 하는 대신 필요한 컨텍스트를 제공해 Vortex가 줄인 토큰의 추정치입니다.
vortex_dashboard.impact_roi.badge.estimate=추정
vortex_dashboard.impact_roi.badge.measured=측정
vortex_dashboard.impact_roi.badge.estimate_description=관찰된 Vortex 활동과, Vortex가 없었다면 일어났을 일에 대한 보수적인 가정으로 계산한 값입니다. 직접 관찰한 결과가 아닙니다.
vortex_dashboard.impact_roi.badge.measured_description=분석 사이에 해결된 이슈나 에이전트에 제공한 규칙처럼 Vortex가 직접 관찰한 활동에 기반한 값입니다.
vortex_dashboard.impact_roi.engineering_time_modal.title=절약한 엔지니어링 시간 계산 방법
vortex_dashboard.impact_roi.engineering_time_modal.intro=절약한 엔지니어링 시간은 코드가 검토나 CI에 이르기 전에 Vortex가 줄인 재작업의 추정치입니다.
vortex_dashboard.impact_roi.engineering_time_modal.methodology=Vortex Guide와 Verify 활동을 바탕으로 Sonar 규칙의 수정 작업량과 보수적인 가정을 사용해 계산합니다. 개별 개발자의 시간을 측정한 것이 아닙니다.
vortex_dashboard.impact_roi.engineering_time_modal.total_label=총 예상 절약 시간
vortex_dashboard.impact_roi.engineering_time_modal.total_formula=Guide 기여분 + Verify 기여분
vortex_dashboard.impact_roi.engineering_time_modal.guide_contribution_title=Guide 기여분(예상 방지)
vortex_dashboard.impact_roi.engineering_time_modal.guide_contribution_description=Guide가 프로젝트 규칙을 제공했을 때, 그렇지 않았다면 이슈가 검토 단계까지 갔을 경우의 재작업을 줄인 것으로 추정합니다.
vortex_dashboard.impact_roi.engineering_time_modal.guide_formula=예상 방지 이슈 × 이슈가 검토 단계까지 갔을 가능성 × (Sonar 수정 작업량 + 검토 시간)
vortex_dashboard.impact_roi.engineering_time_modal.verify_contribution_title=Verify 기여분(해결한 이슈)
vortex_dashboard.impact_roi.engineering_time_modal.verify_contribution_description=Verify가 이슈를 찾고 이후 분석에서 더 이상 찾지 못하면, 에이전트 워크플로 중에 처리해 줄인 재작업을 추정합니다.
vortex_dashboard.impact_roi.engineering_time_modal.verify_formula=이슈가 달리 수정되었을 가능성 × 조정된 Sonar 수정 작업량 + 검토 단계까지 갔을 가능성 × 예상 검토 왕복 1회
vortex_dashboard.impact_roi.engineering_time_modal.whats_included=포함되는 항목
vortex_dashboard.impact_roi.engineering_time_modal.whats_included.items=<li><b>Sonar 수정 작업량:</b> 각 Sonar 규칙을 수정하는 데 드는 표준 예상 시간입니다.</li><li><b>검토 시간:</b> 줄인 검토, 수정, 재검토 과정의 보수적인 추정치입니다.</li><li><b>보수적인 조정:</b> 확률과 묶음 조정을 적용해 모든 발견 사항을 별도의 완전한 재작업 주기로 계산하지 않게 합니다.</li>
vortex_dashboard.impact_roi.engineering_time_modal.guardrail_title=안전장치 / 신뢰성 참고
vortex_dashboard.impact_roi.engineering_time_modal.guardrail_description=이슈는 사고나 침해를 일으키지 않고 일반 풀 리퀘스트 워크플로에서 잡혔을 것으로 추정합니다. 공유된 검토 작업량은 이슈마다가 아니라 에이전트 활동마다 한 번씩 셉니다.
vortex_dashboard.impact_roi.tokens_modal.title=절약한 토큰 계산 방법
vortex_dashboard.impact_roi.tokens_modal.intro=절약한 토큰은 Vortex가 줄인 에이전트 입력 토큰의 추정치입니다.
vortex_dashboard.impact_roi.tokens_modal.methodology=Vortex는 불필요한 코드베이스 탐색을 줄이고, 큰 명령 출력을 에이전트 컨텍스트에 넣기 전에 압축합니다.
vortex_dashboard.impact_roi.tokens_modal.total_label=예상 절약 토큰
vortex_dashboard.impact_roi.tokens_modal.total_formula=탐색 절약분
vortex_dashboard.impact_roi.tokens_modal.navigation_title=탐색 절약분(집중된 코드베이스 탐색)
vortex_dashboard.impact_roi.tokens_modal.navigation_description=Vortex가 코드베이스 구조에 관한 질문에 답하면, 그렇지 않았다면 에이전트가 코드를 검색하고 읽는 데 썼을 토큰을 추정한 뒤 Vortex 응답 크기를 뺍니다.
vortex_dashboard.impact_roi.tokens_modal.formula=max(0, (예상 탐색 토큰 − Vortex 응답 토큰) × 컨텍스트 증폭 계수*)
vortex_dashboard.impact_roi.tokens_modal.amplification_footnote=*컨텍스트 증폭 계수: 에이전트 컨텍스트에 추가된 정보는 이후 요청에서 다시 전송될 수 있습니다. 증폭 계수는 이렇게 반복되는 입력 비용을 보수적인 고정값으로 추정합니다.
vortex_dashboard.impact_roi.tokens_modal.trust_note_title=신뢰성 참고
vortex_dashboard.impact_roi.tokens_modal.trust_note=응답 크기와 압축으로 줄어든 바이트는 관찰값입니다. 에이전트가 달리 사용했을 토큰과 컨텍스트 증폭 효과는 추정값이므로 이 지표는 추정으로 표시됩니다.
