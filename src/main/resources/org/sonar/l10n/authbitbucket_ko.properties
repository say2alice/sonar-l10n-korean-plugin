# 상용 에디션 서버 번들의 한국어 번역입니다. 키와 순서는 상용 번들 동기화 도구가 영문 사본에 맞춥니다.
# 번역 파일에도 있는 키는 번역 파일의 값으로 다시 쓰이므로 번역 파일에서 고칩니다. 번들에만 있는 키는 이 파일에서 값만 고칩니다.
property.category.security.bitbucket=Bitbucket
property.category.security.bitbucket.description=Bitbucket 인증을 사용하려면 다음이 필요합니다.<ul><li>SonarQube에 HTTPS로만 공개 접속할 수 있어야 합니다</li><li>'sonar.core.serverBaseURL' 속성을 이 공개 HTTPS URL로 설정해야 합니다</li><li>Bitbucket 프로필에서 OAuth consumer를 만들고, 'Callback URL'을 <code>'&lt;value_of_sonar.core.serverBaseURL_property&gt;/oauth2/callback'</code>으로, 권한을 Account:Read로 설정해야 합니다</li></ul>
